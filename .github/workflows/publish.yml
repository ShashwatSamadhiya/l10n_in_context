# Publishes to pub.dev when a version tag such as v0.1.1 is pushed.
#
# One-time setup, after the first version was published by hand:
# pub.dev → package → Admin → Automated publishing → Enable publishing from
# GitHub Actions, repository "ShashwatSamadhiya/l10n_in_context", tag pattern
# "v{{version}}". The tag must match the version in pubspec.yaml.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write # Lets pub.dev verify the run with OIDC; no secrets needed.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
