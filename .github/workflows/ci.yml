name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: Analyze and test (Flutter stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed bin lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Example is up to date and analyzes cleanly
        working-directory: example
        run: |
          flutter pub get
          flutter gen-l10n
          dart run l10n_in_context:generate --check
          flutter analyze

      - name: Publish dry run
        run: dart pub publish --dry-run

  minimum:
    name: Test on minimum versions (Flutter 3.32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      # The lowest versions pubspec.yaml allows, so the declared ranges stay
      # honest.
      - name: Install lowest allowed dependencies
        run: flutter pub downgrade

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
